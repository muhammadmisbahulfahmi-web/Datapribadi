<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY DOCUMENTS - Personal Document Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e3a8a', secondary: '#3b82f6', accent: '#f59e0b' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs (Modular) as Modules -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://unpkg.com/react@18/umd/react.production.min.js",
                "react-dom": "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, addDoc, orderBy, serverTimestamp } from 'firebase/firestore';

        const { useState, useEffect, createContext, useContext } = React;

        // ==========================================
        // 1. KONFIGURASI FIREBASE MILIK ANDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDC2RFaoVnOFVVYRRhbFcbvO0ZdbT1Bfug",
            authDomain: "datapribadiv1.firebaseapp.com",
            databaseURL: "https://datapribadiv1-default-rtdb.firebaseio.com",
            projectId: "datapribadiv1",
            storageBucket: "datapribadiv1.firebasestorage.app",
            messagingSenderId: "639028229017",
            appId: "1:639028229017:web:e5f33f2e3f86fde5e5d908",
            measurementId: "G-6TVS5Y1VQ2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ==========================================
        // 2. STATE MANAGEMENT (CONTEXT)
        // ==========================================
        const AuthContext = createContext();
        
        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('user');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
                    if (currentUser) {
                        try {
                            const userRef = doc(db, 'users', currentUser.uid);
                            const userSnap = await getDoc(userRef);
                            
                            if (!userSnap.exists()) {
                                // Pengguna baru, otomatis buat data profil di Firestore
                                await setDoc(userRef, {
                                    uid: currentUser.uid,
                                    displayName: currentUser.displayName,
                                    email: currentUser.email,
                                    photoURL: currentUser.photoURL,
                                    role: 'user', // Default role untuk pengguna baru
                                    createdAt: serverTimestamp(),
                                    lastLogin: serverTimestamp()
                                });
                                setRole('user');
                            } else {
                                const userData = userSnap.data();
                                setRole(userData.role);
                                // Update waktu terakhir login
                                await setDoc(userRef, { lastLogin: serverTimestamp() }, { merge: true });
                            }
                            setUser(currentUser);
                        } catch (error) {
                            console.error("Error fetching user data:", error);
                        }
                    } else {
                        setUser(null);
                        setRole('user');
                    }
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            return (
                <AuthContext.Provider value={{ user, role, loading }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        // ==========================================
        // 3. KOMPONEN UI & PAGES
        // ==========================================

        const categories = [
            { id: 'kk', name: 'Kartu Keluarga', icon: 'fa-users' },
            { id: 'ktp', name: 'KTP', icon: 'fa-id-card' },
            { id: 'akta', name: 'Akta Kelahiran', icon: 'fa-baby' },
            { id: 'ijazah', name: 'Ijazah', icon: 'fa-graduation-cap' },
            { id: 'sim', name: 'SIM', icon: 'fa-car' },
            { id: 'paspor', name: 'Paspor', icon: 'fa-passport' },
            { id: 'lainnya', name: 'Lainnya', icon: 'fa-file-alt' }
        ];

        // --- HALAMAN LOGIN ---
        const Login = () => {
            const handleLogin = async () => {
                try {
                    await signInWithPopup(auth, provider);
                } catch (error) {
                    alert("Gagal login: " + error.message);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 fade-in px-4">
                    <div className="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md text-center">
                        <div className="w-20 h-20 bg-primary text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                            <i className="fas fa-folder-open text-3xl"></i>
                        </div>
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">MY DOCUMENTS</h1>
                        <p className="text-gray-500 mb-8">Personal Document Management System</p>
                        
                        <button 
                            onClick={handleLogin}
                            className="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-50 transition-all shadow-sm"
                        >
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-6 h-6" alt="Google" />
                            Lanjutkan dengan Google
                        </button>
                        
                        <div className="mt-8 text-xs text-gray-400">
                            <p><i className="fas fa-lock mr-1"></i> Terenkripsi & Akses Privat</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- LAYOUT DASHBOARD ---
        const DashboardLayout = ({ children, title }) => {
            const { user, role } = useContext(AuthContext);
            const [isSidebarOpen, setSidebarOpen] = useState(false);

            return (
                <div className="flex h-screen overflow-hidden bg-gray-50">
                    {/* Overlay for mobile sidebar */}
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar */}
                    <aside className={`fixed md:static bg-primary text-white w-64 flex-shrink-0 transition-transform duration-300 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 z-30 h-full flex flex-col`}>
                        <div className="p-6 flex items-center gap-3 border-b border-blue-800">
                            <i className="fas fa-folder-open text-2xl"></i>
                            <span className="text-xl font-bold tracking-wider">MY DOCS</span>
                            <button onClick={() => setSidebarOpen(false)} className="ml-auto md:hidden text-gray-300 hover:text-white">
                                <i className="fas fa-times text-xl"></i>
                            </button>
                        </div>
                        
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            <a href="#" className="flex items-center gap-3 px-4 py-3 bg-blue-800 rounded-lg text-white">
                                <i className="fas fa-home w-5"></i> Dashboard
                            </a>
                            <a href="#" className="flex items-center gap-3 px-4 py-3 text-blue-200 hover:bg-blue-800 rounded-lg transition-colors">
                                <i className="fas fa-file-alt w-5"></i> Semua Dokumen
                            </a>
                            {['admin', 'superadmin'].includes(role) && (
                                <a href="#" className="flex items-center gap-3 px-4 py-3 text-accent hover:bg-blue-800 rounded-lg transition-colors font-medium mt-4">
                                    <i className="fas fa-users-cog w-5"></i> Admin Panel
                                </a>
                            )}
                        </nav>
                        
                        <div className="p-4 border-t border-blue-800">
                            <div className="flex items-center gap-3 mb-4">
                                <img src={user.photoURL} alt="Profile" className="w-10 h-10 rounded-full border-2 border-blue-400 bg-gray-300" referrerPolicy="no-referrer" />
                                <div className="overflow-hidden">
                                    <p className="text-sm font-semibold truncate">{user.displayName}</p>
                                    <p className="text-xs text-blue-300 capitalize">{role}</p>
                                </div>
                            </div>
                            <button onClick={() => signOut(auth)} className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg text-sm font-medium transition-colors shadow">
                                <i className="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden w-full relative">
                        <header className="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setSidebarOpen(true)} className="md:hidden text-gray-500 hover:text-gray-700">
                                    <i className="fas fa-bars text-xl"></i>
                                </button>
                                <h2 className="text-xl font-semibold text-gray-800">{title}</h2>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="relative hidden md:block">
                                    <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                    <input type="text" placeholder="Cari dokumen..." className="pl-10 pr-4 py-2 bg-gray-100 border-none rounded-full text-sm focus:ring-2 focus:ring-primary outline-none w-64 transition-all" />
                                </div>
                            </div>
                        </header>
                        
                        <div className="flex-1 overflow-auto p-4 md:p-6">
                            {children}
                        </div>
                    </main>
                </div>
            );
        };

        // --- DASHBOARD USER ---
        const UserDashboard = () => {
            const { user } = useContext(AuthContext);
            const [documents, setDocuments] = useState([]);
            
            // Mengambil dokumen dari database
            useEffect(() => {
                const fetchDocs = async () => {
                    if(!user) return;
                    try {
                        const q = query(collection(db, "documents"), where("ownerUid", "==", user.uid));
                        const querySnapshot = await getDocs(q);
                        const docs = [];
                        querySnapshot.forEach((doc) => { docs.push({ id: doc.id, ...doc.data() }); });
                        setDocuments(docs);
                    } catch (err) {
                        console.error("Gagal mengambil dokumen:", err);
                    }
                };
                fetchDocs();
            }, [user]);

            const triggerUpload = () => {
                // Notifikasi khusus untuk tahap ini
                const modal = document.createElement('div');
                modal.innerHTML = `
                    <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; display:flex; align-items:center; justify-content:center;">
                        <div style="background:white; padding:2rem; border-radius:1rem; max-width:400px; text-align:center;">
                            <h3 style="font-weight:bold; font-size:1.25rem; margin-bottom:1rem;">Tahap Selanjutnya</h3>
                            <p style="color:#4b5563; margin-bottom:1.5rem; font-size:0.9rem;">Fitur upload akan diintegrasikan dengan Cloudinary di Tahap berikutnya. Kita membutuhkan server backend (Vercel) untuk merahasiakan API Secret Anda demi keamanan dokumen.</p>
                            <button onclick="this.parentElement.parentElement.remove()" style="background:#1e3a8a; color:white; padding:0.5rem 1.5rem; border-radius:0.5rem; font-weight:bold;">Tutup</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            };

            return (
                <div className="fade-in space-y-6 max-w-6xl mx-auto">
                    {/* Greeting Banner */}
                    <div className="bg-gradient-to-r from-primary to-secondary rounded-2xl p-6 md:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl md:text-3xl font-bold mb-2">Halo, {user.displayName.split(' ')[0]}! 👋</h2>
                            <p className="text-blue-100 text-sm md:text-base">Selamat datang di arsip dokumen digital pribadi Anda.</p>
                        </div>
                        <button onClick={triggerUpload} className="w-full md:w-auto bg-white text-primary px-6 py-3 rounded-xl font-bold shadow-md hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
                            <i className="fas fa-cloud-upload-alt"></i> Upload Dokumen
                        </button>
                    </div>

                    {/* Stats */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl"><i className="fas fa-file-alt"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">Total Dokumen</p>
                                <p className="text-2xl font-bold text-gray-800">{documents.length}</p>
                            </div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div className="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-xl"><i className="fas fa-shield-alt"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">Status Keamanan</p>
                                <p className="text-xl font-bold text-gray-800">Terenkripsi</p>
                            </div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div className="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center text-xl"><i className="fas fa-tags"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">Kategori Aktif</p>
                                <p className="text-2xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                    </div>

                    {/* Kategori Cepat */}
                    <div>
                        <h3 className="text-lg font-semibold text-gray-800 mb-4">Kategori Dokumen</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3">
                            {categories.map(cat => (
                                <button key={cat.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:border-primary hover:shadow-md transition-all flex flex-col items-center gap-3 group">
                                    <i className={`fas ${cat.icon} text-2xl text-gray-400 group-hover:text-primary transition-colors`}></i>
                                    <span className="text-xs font-semibold text-gray-600 text-center">{cat.name}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Daftar D
