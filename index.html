<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Documents - Vault</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            400: '#818cf8', // Indigo 400
                            500: '#6366f1', // Indigo 500
                            600: '#4f46e5', // Indigo 600
                            900: '#312e81', // Indigo 900
                        },
                        dark: {
                            800: '#1e293b', // Slate 800
                            900: '#0f172a', // Slate 900
                            950: '#020617', // Slate 950
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar untuk Tema Gelap */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-200 font-sans min-h-screen relative antialiased selection:bg-brand-500 selection:text-white">

    <!-- Latar Belakang Custom (Foto Anda) -->
    <!-- Tingkat blur diturunkan (backdrop-blur-sm) dan dilapisi warna hitam transparan (bg-slate-950/80) -->
    <div class="fixed inset-0 z-[-2] bg-cover bg-center" style="background-image: url('background.jpg');"></div>
    <div class="fixed inset-0 z-[-1] bg-slate-950/80 backdrop-blur-sm"></div>

    <!-- Input Tersembunyi Untuk Ganti Foto Profil -->
    <input type="file" id="profileUploadInput" accept="image/*" class="hidden">

    <!-- ==================== HALAMAN LOGIN ==================== -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center p-4 transition-opacity duration-500">
        <div class="glass-panel rounded-3xl p-8 w-full max-w-md shadow-2xl shadow-brand-500/10 text-center border-t border-white/10">
            <div class="w-20 h-20 bg-gradient-to-br from-brand-600 to-purple-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-brand-500/30 mb-6">
                <i class="fa-solid fa-book-open text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">My Vault</h1>
            <p class="text-slate-400 mb-8 text-sm">Brankas Dokumen Digital Premium</p>

            <form id="loginForm" class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
                    <input type="email" id="emailInput" class="w-full px-4 py-3 bg-dark-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition text-white placeholder-slate-500" placeholder="nama@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                    <input type="password" id="passwordInput" class="w-full px-4 py-3 bg-dark-800/50 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition text-white placeholder-slate-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-brand-500/20 active:scale-[0.98]">
                    Masuk ke Brankas
                </button>
            </form>

            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700"></div></div>
                <div class="relative flex justify-center text-xs"><span class="bg-dark-900 px-4 text-slate-400 rounded-full border border-slate-700">ATAU</span></div>
            </div>

            <button id="btnGoogleLogin" class="w-full bg-dark-800 hover:bg-slate-700 text-white border border-slate-600 font-medium py-3 rounded-xl transition-all flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Lanjutkan dengan Google
            </button>
        </div>
    </div>

    <!-- ==================== DASHBOARD ==================== -->
    <div id="dashboardPage" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-72 glass-panel border-r border-white/5 flex flex-col h-auto md:h-screen sticky top-0 z-20">
            <div class="p-6 flex items-center gap-4 border-b border-white/5">
                <div class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-book-open text-white"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-wide">My Vault</h2>
            </div>
            
            <div class="p-6 flex items-center gap-4 border-b border-white/5">
                <div class="relative group cursor-pointer" onclick="document.getElementById('profileUploadInput').click()" title="Klik untuk ganti foto profil">
                    <img id="sidebarProfilePic" src="https://ui-avatars.com/api/?name=User&background=4f46e5&color=fff" class="w-12 h-12 rounded-full border-2 border-slate-600 object-cover group-hover:border-brand-400 transition-colors">
                    <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fa-solid fa-camera text-xs text-white"></i>
                    </div>
                </div>
                <div class="overflow-hidden">
                    <p id="sidebarName" class="font-semibold text-white truncate">Memuat...</p>
                    <p class="text-xs text-brand-400">Personal Account</p>
                </div>
            </div>

            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button class="w-full flex items-center gap-3 px-4 py-3 bg-brand-600/20 text-brand-400 rounded-xl font-medium border border-brand-500/30">
                    <i class="fa-solid fa-house w-5"></i> Semua Folder
                </button>
            </nav>

            <div class="p-4 border-t border-white/5">
                <button id="btnLogout" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-xl transition font-medium">
                    <i class="fa-solid fa-arrow-right-from-bracket w-5"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-8 h-screen overflow-y-auto pb-24 md:pb-8">
            <header class="flex justify-between items-center mb-8 glass-panel p-4 md:p-6 rounded-2xl">
                <div>
                    <h2 class="text-2xl font-bold text-white" id="welcomeText">Halo!</h2>
                    <p class="text-slate-400 text-sm mt-1">Kelola dokumen penting Anda dengan aman.</p>
                </div>
                <!-- Profile Mobile / Desktop Header -->
                <div class="relative group cursor-pointer" onclick="document.getElementById('profileUploadInput').click()" title="Klik untuk ganti foto profil">
                    <img id="headerProfilePic" src="https://ui-avatars.com/api/?name=User&background=4f46e5&color=fff" class="w-12 h-12 rounded-full border-2 border-slate-600 object-cover shadow-lg group-hover:border-brand-400 transition-colors">
                    <div class="absolute -bottom-1 -right-1 bg-brand-600 w-5 h-5 rounded-full flex items-center justify-center border-2 border-dark-900 shadow-sm">
                        <i class="fa-solid fa-pen text-[9px] text-white"></i>
                    </div>
                </div>
            </header>

            <!-- Folder Management -->
            <div class="mb-8">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <h3 class="text-xl font-semibold text-white flex items-center gap-2">
                        <i class="fa-solid fa-folder-open text-brand-400"></i> Brankas Folder
                    </h3>
                    <button onclick="createNewFolder()" class="bg-brand-600 hover:bg-brand-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-lg shadow-brand-500/20 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Buat Folder Baru
                    </button>
                </div>
                
                <div id="folderGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- Folder List goes here -->
                </div>
            </div>
            
            <!-- Document List -->
            <div>
                <h3 class="text-xl font-semibold text-white mb-4 flex items-center gap-2" id="currentFolderName">
                    <i class="fa-solid fa-file-lines text-brand-400"></i> Pilih folder untuk melihat file
                </h3>
                <div id="documentGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Dokumen list -->
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, deleteDoc, doc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // KONFIGURASI FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyCBPtcWIM1s_Vf-4OGCt-LTYeSiosNVRhs",
            authDomain: "data-pribadi-1b175.firebaseapp.com",
            projectId: "data-pribadi-1b175",
            storageBucket: "data-pribadi-1b175.firebasestorage.app",
            messagingSenderId: "236777372220",
            appId: "1:236777372220:web:da9cbc51e966d63147e139",
            measurementId: "G-NC79XS3YDH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        
        let activeFolderId = null;

        // UI Elements
        const loginPage = document.getElementById('loginPage');
        const dashboardPage = document.getElementById('dashboardPage');
        const btnGoogleLogin = document.getElementById('btnGoogleLogin');
        const loginForm = document.getElementById('loginForm');
        const btnLogout = document.getElementById('btnLogout');
        const profileUploadInput = document.getElementById('profileUploadInput');

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginPage.classList.add('hidden');
                dashboardPage.classList.remove('hidden');
                
                // Set User Info
                document.getElementById('welcomeText').textContent = `Halo, ${user.displayName || 'Pengguna'}!`;
                document.getElementById('sidebarName').textContent = user.displayName || 'Pengguna';
                
                const photoUrl = user.photoURL || `https://ui-avatars.com/api/?name=${user.email}&background=4f46e5&color=fff`;
                document.getElementById('headerProfilePic').src = photoUrl;
                document.getElementById('sidebarProfilePic').src = photoUrl;
                
                loadFolders();
            } else {
                loginPage.classList.remove('hidden');
                dashboardPage.classList.add('hidden');
            }
        });

        // Google Login
        btnGoogleLogin.addEventListener('click', () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch(error => {
                alert("Gagal login Google: " + error.message);
            });
        });

        // Email Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            signInWithEmailAndPassword(auth, email, password).catch(error => {
                alert("Login gagal. Periksa email & password Anda.");
            });
        });

        // Logout
        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // ================= GANTI FOTO PROFIL =================
        profileUploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!auth.currentUser) return;

            const headerPic = document.getElementById('headerProfilePic');
            const sidebarPic = document.getElementById('sidebarProfilePic');
            
            // Efek loading
            headerPic.style.opacity = '0.5';
            sidebarPic.style.opacity = '0.5';

            try {
                // Upload ke Storage
                const storageRef = ref(storage, `profiles/${auth.currentUser.uid}/profile_${Date.now()}`);
                await uploadBytes(storageRef, file);
                const photoURL = await getDownloadURL(storageRef);

                // Update Profile Google/Firebase Auth
                await updateProfile(auth.currentUser, {
                    photoURL: photoURL
                });

                // Update UI
                headerPic.src = photoURL;
                sidebarPic.src = photoURL;
                
                alert('Foto profil berhasil diperbarui!');
            } catch (error) {
                console.error(error);
                alert('Gagal mengupload foto profil.');
            } finally {
                headerPic.style.opacity = '1';
                sidebarPic.style.opacity = '1';
                profileUploadInput.value = ''; // Reset input
            }
        });

        // ================= FOLDER MANAGEMENT =================
        window.createNewFolder = async () => {
            const folderName = prompt("Masukkan nama folder baru (misal: Pekerjaan, Berkas Istri):");
            if (!folderName || folderName.trim() === "") return;

            try {
                await addDoc(collection(db, `users/${auth.currentUser.uid}/folders`), {
                    name: folderName,
                    createdAt: serverTimestamp()
                });
                loadFolders();
            } catch (error) {
                alert("Gagal membuat folder: " + error.message);
            }
        };

        async function loadFolders() {
            const folderGrid = document.getElementById('folderGrid');
            folderGrid.innerHTML = `<div class="text-slate-400 text-sm">Memuat folder...</div>`;
            
            try {
                const q = query(collection(db, `users/${auth.currentUser.uid}/folders`), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                folderGrid.innerHTML = "";
                
                if(querySnapshot.empty) {
                    folderGrid.innerHTML = `<div class="col-span-full text-slate-400 p-4 border border-slate-700 border-dashed rounded-xl text-center bg-dark-800/30">Belum ada folder. Buat folder pertama Anda!</div>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const folderDiv = document.createElement('div');
                    folderDiv.className = "glass-panel p-5 rounded-xl cursor-pointer hover:border-brand-500/50 hover:shadow-lg hover:shadow-brand-500/10 transition group";
                    folderDiv.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="text-brand-400 text-2xl group-hover:scale-110 transition-transform"><i class="fa-solid fa-folder"></i></div>
                                <h4 class="font-medium text-white">${data.name}</h4>
                            </div>
                            <button onclick="event.stopPropagation(); deleteFolder('${docSnap.id}')" class="text-slate-500 hover:text-red-400 transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    folderDiv.onclick = () => { openFolder(docSnap.id, data.name); };
                    folderGrid.appendChild(folderDiv);
                });
            } catch (error) {
                folderGrid.innerHTML = `<div class="text-red-400">Gagal memuat: ${error.message}</div>`;
            }
        }

        window.deleteFolder = async (folderId) => {
            if(!confirm("Yakin ingin menghapus folder ini beserta semua isinya?")) return;
            try {
                await deleteDoc(doc(db, `users/${auth.currentUser.uid}/folders`, folderId));
                activeFolderId = null;
                document.getElementById('documentGrid').innerHTML = "";
                document.getElementById('currentFolderName').innerHTML = `<i class="fa-solid fa-file-lines text-brand-400"></i> Pilih folder untuk melihat file`;
                loadFolders();
            } catch(e) {
                alert("Gagal menghapus: " + e.message);
            }
        }

        window.openFolder = (folderId, folderName) => {
            activeFolderId = folderId;
            document.getElementById('currentFolderName').innerHTML = `
                <i class="fa-regular fa-folder-open text-brand-400"></i> Folder: ${folderName} 
                <button onclick="uploadDocument()" class="ml-4 bg-dark-800 hover:bg-slate-700 border border-slate-600 text-xs px-3 py-1.5 rounded-lg text-white transition"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Upload File</button>
            `;
            loadDocuments();
        };

        // ================= DOCUMENT MANAGEMENT =================
        window.uploadDocument = () => {
            if (!activeFolderId) {
                alert("Pilih folder terlebih dahulu!"); return;
            }
            
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,application/pdf';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const docName = prompt("Beri nama untuk file ini:", file.name);
                if (!docName) return;

                const storageRef = ref(storage, `documents/${auth.currentUser.uid}/${activeFolderId}/${Date.now()}_${file.name}`);
                const uploadTask = uploadBytesResumable(storageRef, file);

                document.getElementById('currentFolderName').innerHTML += ` <span class="text-xs text-brand-400 ml-2 animate-pulse">Mengupload...</span>`;

                uploadTask.on('state_changed', 
                    (snapshot) => {}, 
                    (error) => { alert("Upload Gagal: " + error.message); }, 
                    async () => {
                        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                        await addDoc(collection(db, `users/${auth.currentUser.uid}/documents`), {
                            folderId: activeFolderId,
                            name: docName,
                            fileName: file.name,
                            url: downloadURL,
                            type: file.type,
                            path: uploadTask.snapshot.ref.fullPath,
                            createdAt: serverTimestamp()
                        });
                        loadDocuments();
                    }
                );
            };
            input.click();
        };

        async function loadDocuments() {
            if (!activeFolderId) return;
            
            const docGrid = document.getElementById('documentGrid');
            docGrid.innerHTML = `<div class="text-slate-400 text-sm">Memuat file...</div>`;

            try {
                const q = query(collection(db, `users/${auth.currentUser.uid}/documents`), where("folderId", "==", activeFolderId));
                const querySnapshot = await getDocs(q);
                
                docGrid.innerHTML = "";
                
                if(querySnapshot.empty) {
                    docGrid.innerHTML = `<div class="col-span-full text-slate-500 p-8 border border-slate-700 border-dashed rounded-xl text-center bg-dark-800/30">Folder kosong. Klik tombol Upload File.</div>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const isImg = data.type.startsWith('image/');
                    const icon = isImg ? 'fa-image text-purple-400' : 'fa-file-pdf text-rose-400';
                    
                    const card = document.createElement('div');
                    card.className = "glass-panel p-4 rounded-xl flex flex-col gap-3 group border-l-4 border-l-brand-500";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-dark-800 flex items-center justify-center border border-slate-700">
                                    <i class="fa-solid ${icon} text-lg"></i>
                                </div>
                                <div>
                                    <h4 class="font-medium text-sm text-white truncate w-32 md:w-40" title="${data.name}">${data.name}</h4>
                                    <span class="text-[10px] text-slate-400 uppercase tracking-wider">${isImg ? 'GAMBAR' : 'PDF'}</span>
                                </div>
                            </div>
                            <button onclick="deleteDocument('${docSnap.id}', '${data.path}')" class="text-slate-500 hover:text-red-400 transition"><i class="fa-solid fa-trash text-sm"></i></button>
                        </div>
                        <div class="mt-2 grid grid-cols-2 gap-2">
                            <a href="${data.url}" target="_blank" class="text-center py-2 bg-dark-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-xs font-medium text-white transition"><i class="fa-solid fa-eye mr-1"></i> Lihat</a>
                            <a href="${data.url}" download class="text-center py-2 bg-brand-600/20 hover:bg-brand-600/40 border border-brand-500/30 text-brand-400 rounded-lg text-xs font-medium transition"><i class="fa-solid fa-download mr-1"></i> Unduh</a>
                        </div>
                    `;
                    docGrid.appendChild(card);
                });
            } catch(e) {
                docGrid.innerHTML = `<div class="text-red-400">Error: ${e.message}</div>`;
            }
        }

        window.deleteDocument = async (docId, filePath) => {
            if(!confirm("Hapus dokumen ini permanen?")) return;
            try {
                await deleteObject(ref(storage, filePath));
                await deleteDoc(doc(db, `users/${auth.currentUser.uid}/documents`, docId));
                loadDocuments();
            } catch(e) {
                alert("Gagal menghapus: " + e.message);
            }
        }
    </script>
</body>
</html>
