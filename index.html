<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY DOCUMENTS - Personal Document Management</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat SDKs (Stabil untuk semua browser) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e3a8a', secondary: '#3b82f6', accent: '#f59e0b' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        #error-log { display: none; background: #fee2e2; color: #991b1b; padding: 1rem; margin: 1rem; border-radius: 8px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div id="error-log"></div>
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; gap:1rem;">
            <div style="width:50px; height:50px; border:5px solid #ccc; border-top-color:#1e3a8a; border-radius:50%; animation:spin 1s linear infinite;"></div>
            <p style="font-family:sans-serif; color:#555;">Memuat Sistem...</p>
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <!-- Script Penangkap Error Global -->
    <script>
        window.addEventListener('error', function(event) {
            const errLog = document.getElementById('error-log');
            if(errLog) {
                errLog.style.display = 'block';
                errLog.innerText += 'Error: ' + event.message + '\n\n';
            }
        });
        window.addEventListener('unhandledrejection', function(event) {
            const errLog = document.getElementById('error-log');
            if(errLog) {
                errLog.style.display = 'block';
                errLog.innerText += 'Promise Error: ' + event.reason + '\n\n';
            }
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // ==========================================
        // 1. INISIALISASI FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDC2RFaoVnOFVVYRRhbFcbvO0ZdbT1Bfug",
            authDomain: "datapribadiv1.firebaseapp.com",
            databaseURL: "https://datapribadiv1-default-rtdb.firebaseio.com",
            projectId: "datapribadiv1",
            storageBucket: "datapribadiv1.firebasestorage.app",
            messagingSenderId: "639028229017",
            appId: "1:639028229017:web:e5f33f2e3f86fde5e5d908",
            measurementId: "G-6TVS5Y1VQ2"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        // ==========================================
        // 2. STATE MANAGEMENT (CONTEXT)
        // ==========================================
        const AuthContext = createContext();
        
        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('user');
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState('');

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
                    if (currentUser) {
                        try {
                            const userRef = db.collection('users').doc(currentUser.uid);
                            const userSnap = await userRef.get();
                            
                            if (!userSnap.exists) {
                                await userRef.set({
                                    uid: currentUser.uid,
                                    // Handle user dari Email/Password yang tidak memiliki displayName atau photoURL awal
                                    displayName: currentUser.displayName || currentUser.email.split('@')[0],
                                    email: currentUser.email,
                                    photoURL: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.email)}&background=1e3a8a&color=fff`,
                                    role: 'user', 
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                                });
                                setRole('user');
                            } else {
                                const userData = userSnap.data();
                                setRole(userData.role || 'user');
                                await userRef.update({ lastLogin: firebase.firestore.FieldValue.serverTimestamp() });
                            }
                            setUser(currentUser);
                        } catch (error) {
                            console.error("Error database:", error);
                            setAuthError("Gagal mengakses database. Pastikan Firestore sudah diaktifkan di Firebase Console.");
                            auth.signOut();
                        }
                    } else {
                        setUser(null);
                        setRole('user');
                    }
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            return (
                <AuthContext.Provider value={{ user, role, loading, authError, setAuthError }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        // ==========================================
        // 3. KOMPONEN UI & PAGES
        // ==========================================
        const categories = [
            { id: 'kk', name: 'Kartu Keluarga', icon: 'fa-users' },
            { id: 'ktp', name: 'KTP', icon: 'fa-id-card' },
            { id: 'akta', name: 'Akta Kelahiran', icon: 'fa-baby' },
            { id: 'ijazah', name: 'Ijazah', icon: 'fa-graduation-cap' },
            { id: 'sim', name: 'SIM', icon: 'fa-car' },
            { id: 'paspor', name: 'Paspor', icon: 'fa-passport' },
            { id: 'lainnya', name: 'Lainnya', icon: 'fa-file-alt' }
        ];

        const Login = () => {
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const { authError, setAuthError } = useContext(AuthContext);

            const handleGoogleLogin = async () => {
                setIsLoggingIn(true);
                setAuthError(''); // Reset error
                try {
                    // Set persistence agar sesi tidak hilang
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                    // Panggil popup langsung tanpa delay
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    console.error("Login Error:", error);
                    setIsLoggingIn(false);
                    // Abaikan error jika user menutup popup sendiri
                    if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
                        setAuthError("Gagal login Google: " + error.message);
                    }
                }
            };

            const handleEmailLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                setAuthError('');
                try {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (error) {
                    console.error("Email Login Error:", error);
                    setIsLoggingIn(false);
                    setAuthError("Gagal login: Periksa kembali email dan password Anda.");
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 fade-in px-4">
                    <div className="bg-white p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md text-center">
                        <div className="w-16 h-16 bg-primary text-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                            <i className="fas fa-folder-open text-2xl"></i>
                        </div>
                        <h1 className="text-2xl font-bold text-gray-800 mb-2">MY DOCUMENTS</h1>
                        <p className="text-gray-500 mb-6 text-sm">Personal Document Management System</p>
                        
                        {authError && (
                            <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm text-left border border-red-200">
                                <i className="fas fa-exclamation-triangle mr-2"></i> {authError}
                            </div>
                        )}

                        <form onSubmit={handleEmailLogin} className="space-y-4 mb-6">
                            <div className="text-left">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email (Admin/User)</label>
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary outline-none transition-colors" placeholder="email@domain.com" />
                            </div>
                            <div className="text-left">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary outline-none transition-colors" placeholder="••••••••" />
                            </div>
                            <button type="submit" disabled={isLoggingIn} className="w-full bg-primary hover:bg-blue-800 text-white font-semibold py-2.5 px-4 rounded-xl transition-all shadow-md disabled:opacity-50 flex justify-center items-center gap-2">
                                {isLoggingIn ? <><i className="fas fa-spinner fa-spin"></i> Memproses...</> : 'Masuk'}
                            </button>
                        </form>

                        <div className="flex items-center my-4">
                            <div className="flex-grow border-t border-gray-200"></div>
                            <span className="px-3 text-gray-400 text-xs uppercase font-medium">Atau Login Cepat</span>
                            <div className="flex-grow border-t border-gray-200"></div>
                        </div>

                        <button 
                            type="button"
                            onClick={handleGoogleLogin}
                            disabled={isLoggingIn}
                            className="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-50 transition-all shadow-sm disabled:opacity-50"
                        >
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-5 h-5" alt="Google" /> Lanjutkan dengan Google
                        </button>
                    </div>
                </div>
            );
        };

        const DashboardLayout = ({ children, title }) => {
            const { user, role } = useContext(AuthContext);
            const [isSidebarOpen, setSidebarOpen] = useState(false);

            return (
                <div className="flex h-screen overflow-hidden bg-gray-50">
                    {isSidebarOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden" onClick={() => setSidebarOpen(false)}></div>
                    )}

                    <aside className={`fixed md:static bg-primary text-white w-64 flex-shrink-0 transition-transform duration-300 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 z-30 h-full flex flex-col`}>
                        <div className="p-6 flex items-center gap-3 border-b border-blue-800">
                            <i className="fas fa-folder-open text-2xl"></i>
                            <span className="text-xl font-bold tracking-wider">MY DOCS</span>
                        </div>
                        
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            <a href="#" className="flex items-center gap-3 px-4 py-3 bg-blue-800 rounded-lg text-white">
                                <i className="fas fa-home w-5"></i> Dashboard
                            </a>
                            <a href="#" className="flex items-center gap-3 px-4 py-3 text-blue-200 hover:bg-blue-800 rounded-lg transition-colors">
                                <i className="fas fa-file-alt w-5"></i> Semua Dokumen
                            </a>
                            {['admin', 'superadmin'].includes(role) && (
                                <a href="#" className="flex items-center gap-3 px-4 py-3 text-accent hover:bg-blue-800 rounded-lg transition-colors font-medium mt-4">
                                    <i className="fas fa-users-cog w-5"></i> Admin Panel
                                </a>
                            )}
                        </nav>
                        
                        <div className="p-4 border-t border-blue-800">
                            <div className="flex items-center gap-3 mb-4">
                                <img src={user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || user.email)}&background=1e3a8a&color=fff`} alt="Profile" className="w-10 h-10 rounded-full border-2 border-blue-400 bg-gray-300 object-cover" referrerPolicy="no-referrer" />
                                <div className="overflow-hidden">
                                    <p className="text-sm font-semibold truncate">{user.displayName || user.email.split('@')[0]}</p>
                                    <p className="text-xs text-blue-300 capitalize">{role}</p>
                                </div>
                            </div>
                            <button onClick={() => auth.signOut()} className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg text-sm font-medium transition-colors shadow">
                                <i className="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-full overflow-hidden w-full relative">
                        <header className="bg-white shadow-sm h-16 flex items-center justify-between px-4 md:px-6 z-10">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setSidebarOpen(true)} className="md:hidden text-gray-500 hover:text-gray-700">
                                    <i className="fas fa-bars text-xl"></i>
                                </button>
                                <h2 className="text-lg md:text-xl font-semibold text-gray-800">{title}</h2>
                            </div>
                            
                            {/* Tambahan Profile Picture di Header Kanan */}
                            <div className="flex items-center gap-3">
                                <span className="text-sm font-medium text-gray-700 hidden md:block">{user.displayName || user.email.split('@')[0]}</span>
                                <img src={user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || user.email)}&background=1e3a8a&color=fff`} alt="Profile" className="w-9 h-9 rounded-full border border-gray-200 object-cover shadow-sm" referrerPolicy="no-referrer" />
                            </div>
                        </header>
                        <div className="flex-1 overflow-auto p-4 md:p-6">
                            {children}
                        </div>
                    </main>
                </div>
            );
        };

        const UserDashboard = () => {
            const { user } = useContext(AuthContext);
            const [documents, setDocuments] = useState([]);
            const [customFolders, setCustomFolders] = useState([]);
            const [isCreatingFolder, setIsCreatingFolder] = useState(false);
            const [newFolderName, setNewFolderName] = useState('');
            
            useEffect(() => {
                const fetchDocs = async () => {
                    if(!user) return;
                    try {
                        const snap = await db.collection("documents").where("ownerUid", "==", user.uid).get();
                        const docs = [];
                        snap.forEach((doc) => { docs.push({ id: doc.id, ...doc.data() }); });
                        setDocuments(docs);
                    } catch (err) {
                        console.error("Belum ada dokumen / error:", err);
                    }
                };

                const fetchFolders = () => {
                    if(!user) return;
                    // Mendengarkan perubahan folder secara real-time
                    return db.collection("folders")
                             .where("ownerUid", "==", user.uid)
                             .orderBy("createdAt", "asc")
                             .onSnapshot((snap) => {
                                 const f = [];
                                 snap.forEach(doc => f.push({ id: doc.id, ...doc.data() }));
                                 setCustomFolders(f);
                             }, err => console.error("Error mengambil folder:", err));
                };

                fetchDocs();
                const unsubscribeFolders = fetchFolders();
                
                return () => {
                    if(unsubscribeFolders) unsubscribeFolders(); // Bersihkan listener saat pindah halaman
                };
            }, [user]);

            const handleCreateFolder = async (e) => {
                e.preventDefault();
                if(!newFolderName.trim()) return;
                try {
                    await db.collection("folders").add({
                        ownerUid: user.uid,
                        name: newFolderName,
                        icon: 'fa-folder', // Default icon untuk custom folder
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewFolderName('');
                    setIsCreatingFolder(false);
                } catch(err) {
                    alert("Gagal membuat folder. Pastikan Security Rules Firestore Anda mengizinkan create folder.");
                }
            };

            const handleDeleteFolder = async (folderId, folderName) => {
                if(window.confirm(`Hapus kategori folder "${folderName}"?\n\n(Dokumen di dalamnya tidak akan ikut terhapus, hanya kategorinya saja)`)) {
                    try {
                        await db.collection("folders").doc(folderId).delete();
                    } catch(err) {
                        alert("Gagal menghapus folder: " + err.message);
                    }
                }
            };

            return (
                <div className="fade-in space-y-6 max-w-6xl mx-auto">
                    <div className="bg-gradient-to-r from-primary to-secondary rounded-2xl p-6 md:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl md:text-3xl font-bold mb-2">Halo, {user.displayName ? user.displayName.split(' ')[0] : (user.email.split('@')[0])}! 👋</h2>
                            <p className="text-blue-100 text-sm md:text-base">Selamat datang di arsip dokumen digital pribadi Anda.</p>
                        </div>
                        <button onClick={() => alert('Fitur Upload akan aktif di tahap selanjutnya (Cloudinary Integration)')} className="w-full md:w-auto bg-white text-primary px-6 py-3 rounded-xl font-bold shadow-md hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
                            <i className="fas fa-cloud-upload-alt"></i> Upload Dokumen
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl"><i className="fas fa-file-alt"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">Total Dokumen</p>
                                <p className="text-2xl font-bold text-gray-800">{documents.length}</p>
                            </div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                            <div className="w-12 h-12 bg-accent/20 text-accent rounded-full flex items-center justify-center text-xl"><i className="fas fa-folder"></i></div>
                            <div>
                                <p className="text-sm text-gray-500 font-medium">Total Kategori</p>
                                <p className="text-2xl font-bold text-gray-800">{categories.length + customFolders.length}</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-semibold text-gray-800">Kategori Dokumen</h3>
                            <button onClick={() => setIsCreatingFolder(true)} className="text-sm bg-blue-50 text-primary px-4 py-2 rounded-lg hover:bg-blue-100 font-semibold transition-colors shadow-sm flex items-center gap-2">
                                <i className="fas fa-folder-plus"></i> Buat Folder Baru
                            </button>
                        </div>

                        {/* Modal Buat Folder */}
                        {isCreatingFolder && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center px-4">
                                <div className="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm fade-in">
                                    <div className="flex justify-between items-center mb-4">
                                        <h4 className="text-lg font-bold text-gray-800">Buat Folder Baru</h4>
                                        <button onClick={() => setIsCreatingFolder(false)} className="text-gray-400 hover:text-red-500"><i className="fas fa-times"></i></button>
                                    </div>
                                    <form onSubmit={handleCreateFolder}>
                                        <label className="block text-sm text-gray-600 mb-2">Nama Kategori/Folder</label>
                                        <input type="text" autoFocus required value={newFolderName} onChange={e => setNewFolderName(e.target.value)} placeholder="Contoh: Asuransi, Sertifikat..." className="w-full border border-gray-300 rounded-lg px-4 py-3 mb-6 focus:ring-primary focus:border-primary outline-none" />
                                        <div className="flex justify-end gap-3">
                                            <button type="button" onClick={() => setIsCreatingFolder(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition-colors">Batal</button>
                                            <button type="submit" className="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-800 font-medium transition-colors shadow-md">Simpan Folder</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3">
                            {/* Default Folders */}
                            {categories.map(cat => (
                                <button key={cat.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:border-primary hover:shadow-md transition-all flex flex-col items-center gap-3 group">
                                    <i className={`fas ${cat.icon} text-2xl text-gray-400 group-hover:text-primary transition-colors`}></i>
                                    <span className="text-xs font-semibold text-gray-600 text-center">{cat.name}</span>
                                </button>
                            ))}
                            
                            {/* Render Custom Folders dari Database */}
                            {customFolders.map(folder => (
                                <div key={folder.id} className="bg-white p-4 rounded-xl shadow-sm border border-dashed border-gray-300 hover:border-accent hover:shadow-md transition-all flex flex-col items-center gap-3 group relative cursor-pointer">
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); handleDeleteFolder(folder.id, folder.name); }} 
                                        className="absolute top-2 right-2 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                                        title="Hapus Folder"
                                    >
                                        <i className="fas fa-trash-alt text-xs"></i>
                                    </button>
                                    <i className={`fas ${folder.icon} text-2xl text-accent transition-colors`}></i>
                                    <span className="text-xs font-semibold text-gray-600 text-center truncate w-full px-1">{folder.name}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = () => {
            const [users, setUsers] = useState([]);
            const [loadingData, setLoadingData] = useState(true);
            
            useEffect(() => {
                const fetchUsers = async () => {
                    try {
                        const snap = await db.collection("users").orderBy("createdAt", "desc").get();
                        const usersList = [];
                        snap.forEach((doc) => usersList.push(doc.data()));
                        setUsers(usersList);
                    } catch(err) {
                        console.log("Error mengambil user:", err);
                    } finally {
                        setLoadingData(false);
                    }
                };
                fetchUsers();
            }, []);

            return (
                <div className="fade-in space-y-6 max-w-6xl mx-auto">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">Admin Panel</h2>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="p-5 border-b border-gray-100 bg-gray-50">
                            <h3 className="font-bold text-gray-700">Daftar Pengguna Sistem ({users.length})</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                                        <th className="p-4 font-semibold border-b">Profil Pengguna</th>
                                        <th className="p-4 font-semibold border-b">Email</th>
                                        <th className="p-4 font-semibold border-b text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {loadingData ? (
                                        <tr><td colSpan="3" className="p-8 text-center text-gray-500">Memuat data...</td></tr>
                                    ) : users.length === 0 ? (
                                        <tr><td colSpan="3" className="p-8 text-center text-gray-500">Belum ada pengguna.</td></tr>
                                    ) : (
                                        users.map(u => (
                                            <tr key={u.uid} className="hover:bg-gray-50 border-b border-gray-100">
                                                <td className="p-4 flex items-center gap-3">
                                                    <img src={u.photoURL || 'https://via.placeholder.com/150'} alt="Foto" className="w-10 h-10 rounded-full" referrerPolicy="no-referrer" />
                                                    <span className="font-semibold text-gray-800">{u.displayName}</span>
                                                </td>
                                                <td className="p-4 text-gray-600 text-sm">{u.email}</td>
                                                <td className="p-4 text-center">
                                                    <button className="bg-blue-50 text-primary px-3 py-1.5 rounded-lg text-sm font-semibold">
                                                        Lihat
                                                    </button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const { user, role, loading } = useContext(AuthContext);

            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50 gap-4">
                        <div className="w-12 h-12 border-4 border-gray-200 border-t-primary rounded-full animate-spin" style={{ animation: 'spin 1s linear infinite' }}></div>
                        <p className="text-gray-500 font-medium">Memuat sistem...</p>
                    </div>
                );
            }

            if (!user) return <Login />;
            if (role === 'admin' || role === 'superadmin') {
                return <DashboardLayout title="Admin Dashboard"><AdminDashboard /></DashboardLayout>;
            }
            return <DashboardLayout title="Dashboard Saya"><UserDashboard /></DashboardLayout>;
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<AuthProvider><App /></AuthProvider>);
        } catch(e) {
            console.error(e);
            document.getElementById('error-log').style.display = 'block';
            document.getElementById('error-log').innerText = "React Error: " + e.message;
        }
    </script>
</body>
</html>
